name: exhaustive-tests

on:
  push:
  pull_request:

jobs:
  node-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: for f in js/*.js tests/*.js; do node --check "$f"; done
      - name: 穷举测试（数据/答案/文案算式/一致性）
        run: node tests/exhaustive.node.js
